[workspace]
authors = ["yanjunrui <yan.junrui@kotei.com.cn>"]
channels = ["conda-forge"]
name = "deca"
platforms = ["linux-64"]
version = "0.4.0"
readme = "README.md"

[tasks]
build = { cmd = "go build -ldflags \"-X github.com/kusutori/deca/cmd.Version=$(git describe --tags --always 2>/dev/null || date +%Y%m%d) -X github.com/kusutori/deca/cmd.Build=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X github.com/kusutori/deca/cmd.BuildTime=$(date +%Y%m%d%H%M%S)\" -o deca .", description = "Build the binary" }

debug = { cmd = "go build -ldflags \"-X github.com/kusutori/deca/cmd.Version=$(git describe --tags --always 2>/dev/null || date +%Y%m%d) -X github.com/kusutori/deca/cmd.Build=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X github.com/kusutori/deca/cmd.BuildTime=$(date +%Y%m%d%H%M%S)\" -gcflags=\"all=-N -l\" -o deca .", description = "Build with debug symbols" }

static = { cmd = "CC=musl-gcc CGO_ENABLED=1 go build -ldflags \"-X github.com/kusutori/deca/cmd.Version=$(git describe --tags --always 2>/dev/null || date +%Y%m%d) -X github.com/kusutori/deca/cmd.Build=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X github.com/kusutori/deca/cmd.BuildTime=$(date +%Y%m%d%H%M%S) -linkmode=external -extldflags=-static\" -o deca .", description = "Static build (requires musl-gcc)" }

test = "go test ./..."

install = { cmd = "go install -ldflags \"-X github.com/kusutori/deca/cmd.Version=$(git describe --tags --always 2>/dev/null || date +%Y%m%d) -X github.com/kusutori/deca/cmd.Build=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X github.com/kusutori/deca/cmd.BuildTime=$(date +%Y%m%d%H%M%S)\" .", description = "Install to GOPATH" }

info = { cmd = "echo \"deca version: $(git describe --tags --always 2>/dev/null || date +%Y%m%d)\" && echo \"build:        $(git rev-parse --short HEAD 2>/dev/null || echo unknown)\" && echo \"build time:   $(date +%Y%m%d%H%M%S)\" && echo \"go:           $(go version)\"", description = "Show version info" }

clean = "rm -f deca"

release = { cmd = "mkdir -p dist && for os in linux darwin windows; do for arch in amd64 arm64; do echo \"Building for $os/$arch...\" && GOOS=$os GOARCH=$arch go build -ldflags \"-X github.com/kusutori/deca/cmd.Version=$(git describe --tags --always 2>/dev/null || date +%Y%m%d) -X github.com/kusutori/deca/cmd.Build=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X github.com/kusutori/deca/cmd.BuildTime=$(date +%Y%m%d%H%M%S)\" -o \"dist/deca-$os-$arch\" . || exit 1; done; done", description = "Build release binaries for all platforms" }

musl-release = { cmd = "mkdir -p dist && echo \"Note: musl-release requires musl-gcc (sudo apt install musl-tools)\" && for arch in amd64 arm64; do echo \"Building static for linux/$arch...\" && CC=musl-gcc CGO_ENABLED=1 GOOS=linux GOARCH=$arch go build -ldflags \"-X github.com/kusutori/deca/cmd.Version=$(git describe --tags --always 2>/dev/null || date +%Y%m%d) -X github.com/kusutori/deca/cmd.Build=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -X github.com/kusutori/deca/cmd.BuildTime=$(date +%Y%m%d%H%M%S) -linkmode=external -extldflags=-static\" -o \"dist/deca-linux-$arch-static\" . || exit 1; done", description = "Build static Linux release binaries via musl" }

setup = "go mod download"

python-bindings = { cmd = "GOBIN=$(go env GOPATH)/bin && if [ ! -x \"$GOBIN/goimports\" ] && ! command -v goimports >/dev/null 2>&1; then echo \"goimports not found. Run: pixi run setup-python-bindings\" && exit 1; fi && mkdir -p bindings/python && PATH=\"$GOBIN:$PATH\" go run github.com/go-python/gopy pkg -vm=python3 -name=deca_py -output=bindings/python github.com/kusutori/deca/pkg/pydeca && echo \"Generated bindings at bindings/python\" && echo \"Install with: python3 -m pip install -e bindings/python\"", description = "Generate Python bindings (output in bindings/python/)" }

[dependencies]
python = ">=3.14.3,<3.15"
ptpython = ">=3.0.32,<4"
gcc_linux-64 = ">=15.2.0,<16"
go = ">=1.26.1,<2"
gopls = ">=0.20.0,<0.21"

[pypi-dependencies]
deca_py = { path = "./bindings/python" }

