name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test with coverage
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Calculate base coverage (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git worktree add ../deca-base "origin/${{ github.base_ref }}"
          pushd ../deca-base >/dev/null
          go test ./... -coverprofile=coverage-base.out
          base_total=$(go tool cover -func=coverage-base.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "BASELINE_COVERAGE=${base_total}" >> "$GITHUB_ENV"
          echo "Base branch (${{ github.base_ref }}) coverage: ${base_total}%"
          popd >/dev/null
          git worktree remove ../deca-base --force

      - name: Coverage gate
        run: scripts/coverage_gate.sh coverage.out
        env:
          COVERAGE_STAGE: final
          BASELINE_COVERAGE: ${{ env.BASELINE_COVERAGE }}
